server:
  addr: ":8080"
  mode: "debug"

db:
  driver: "sqlite"      # sqlite 或 postgres
  sqlitepath: "msmp.db"
  # dsn: "host=localhost user=msmp password=msmp dbname=msmp port=5432 sslmode=disable TimeZone=Asia/Shanghai"

jwt:
  secret: "change-me-in-production"
  expirehour: 24

agent:
  transport: "http"
  heartbeatsec: 30
  assetreportsec: 300
  metricreportsec: 60
  offlineaftersec: 120

security:
  credentialkey: ""    # base64 编码的 32 字节 AES 密钥，留空则无法保存采集渠道凭据