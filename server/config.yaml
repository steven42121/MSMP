server:
  addr: ":8080"
  mode: "debug"
  # nodes:
  #   - "http://10.0.0.1:8080"
  #   - "http://10.0.0.2:8080"
  # node_id: "node-a"   # 留空则自动生成 UUID 前 8 位

db:
  driver: "sqlite"      # sqlite 或 postgres
  sqlitepath: "msmp.db"
  # dsn: "host=localhost user=msmp password=msmp dbname=msmp port=5432 sslmode=disable TimeZone=Asia/Shanghai"

jwt:
  secret: "change-me-in-production"
  expirehour: 24

agent:
  transport: "http"
  heartbeatsec: 30
  assetreportsec: 300
  metricreportsec: 30
  offlineaftersec: 120
  latest_version: "0.1.0"
  download_url: "https://github.com/steven42121/MSMP/releases/download/{{.Tag}}/msmp-{{.Tag}}-linux-amd64.tar.gz"

security:
  credentialkey: "N2+vko0Opmja3d7NQk8jMPNPArzTqjOrqiUFR1Na+NA="    # base64 编码的 32 字节 AES 密钥，留空则无法保存采集渠道凭据
  # ip_allowlist:                                              # IP 白名单（为空则不限制，非空时仅允许列表内 IP）
  #   - "127.0.0.1"
  #   - "10.0.0.0/8"