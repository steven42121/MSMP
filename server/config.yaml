server:
  addr: ":8080"
  mode: "debug"                              # debug=开发模式(日志文本/CORS通配) | release=生产模式(日志JSON/CORS白名单)
  # advertise_addr: "http://10.0.0.1:8080"   # 集群通告地址（多节点必填）
  # max_request_body_bytes: 10485760          # 请求体上限（默认 10MB）
  # nodes:
  #   - "http://10.0.0.1:8080"
  #   - "http://10.0.0.2:8080"
  # node_id: "node-a"   # 留空则自动生成 UUID 前 8 位

db:
  driver: "postgres"
  # sqlitepath: "msmp.db"
  dsn: "host=127.0.0.1 user=msmp password=msmp123 dbname=msmp port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  max_open_conns: 25                         # 最大打开连接数
  max_idle_conns: 10                         # 最大空闲连接数
  conn_max_lifetime: 900                     # 连接最大存活时间（秒）

jwt:
  secret: "change-me-in-production"          # 生产环境必须修改！
  expirehour: 24

agent:
  transport: "http"
  heartbeatsec: 30
  assetreportsec: 300
  metricreportsec: 30
  offlineaftersec: 120
  latest_version: "0.1.0"
  download_url: "https://github.com/steven42121/MSMP/releases/download/{{.Tag}}/msmp-{{.Tag}}-linux-amd64.tar.gz"

security:
  credentialkey: "N2+vko0Opmja3d7NQk8jMPNPArzTqjOrqiUFR1Na+NA="    # base64 编码的 32 字节 AES 密钥，留空则无法保存采集渠道凭据
  # ip_allowlist:                                              # IP 白名单（支持 CIDR，为空则不限制）
  #   - "127.0.0.1"
  #   - "10.0.0.0/8"
  # allowed_origins:                                           # CORS 白名单（空=开发模式放行所有来源）
  #   - "https://msmp.example.com"
  # max_login_attempts: 5                                      # 登录失败最大次数
  # login_lockout_sec: 600                                     # 锁定时长（秒）
  # rate_limit_per_min: 0                                      # 登录速率限制（次/分钟，0=不限）
  # pve_insecure_verify: true                                  # PVE TLS 证书校验（实验室环境建议 true）

retention:
  raw_retention_days: 90       # 原始指标保留天数
  downsample_at_days: 7        # 超过此天数的原始数据降采样
  downsample_interval: 5       # 降采样粒度（分钟）