name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
        node-version: ['20']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ── Server ──────────────────────────────────────────────
      - name: Build server linux-amd64
        working-directory: server
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o msmp-server-linux-amd64 .

      - name: Build server linux-arm64
        working-directory: server
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o msmp-server-linux-arm64 .

      - name: Build server windows-amd64
        working-directory: server
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o msmp-server-windows-amd64.exe .

      # ── Agent ───────────────────────────────────────────────
      - name: Build agent linux-amd64
        working-directory: agent
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o msmp-agent-linux-amd64 .

      - name: Build agent linux-arm64
        working-directory: agent
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o msmp-agent-linux-arm64 .

      - name: Build agent windows-amd64
        working-directory: agent
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o msmp-agent-windows-amd64.exe .

      # ── Frontend ────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Archive per platform ───────────────────────────────
      - name: Package linux-amd64
        run: |
          mkdir -p msmp-${{ steps.version.outputs.VERSION }}-linux-amd64
          cp server/msmp-server-linux-amd64    msmp-${{ steps.version.outputs.VERSION }}-linux-amd64/
          cp server/config.yaml               msmp-${{ steps.version.outputs.VERSION }}-linux-amd64/
          cp agent/msmp-agent-linux-amd64     msmp-${{ steps.version.outputs.VERSION }}-linux-amd64/
          cp -r frontend/dist msmp-${{ steps.version.outputs.VERSION }}-linux-amd64/frontend-dist
          cp docker-compose.yml               msmp-${{ steps.version.outputs.VERSION }}-linux-amd64/
          tar -czf msmp-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz \
            msmp-${{ steps.version.outputs.VERSION }}-linux-amd64

      - name: Package linux-arm64
        run: |
          mkdir -p msmp-${{ steps.version.outputs.VERSION }}-linux-arm64
          cp server/msmp-server-linux-arm64    msmp-${{ steps.version.outputs.VERSION }}-linux-arm64/
          cp server/config.yaml               msmp-${{ steps.version.outputs.VERSION }}-linux-arm64/
          cp agent/msmp-agent-linux-arm64     msmp-${{ steps.version.outputs.VERSION }}-linux-arm64/
          cp -r frontend/dist msmp-${{ steps.version.outputs.VERSION }}-linux-arm64/frontend-dist
          cp docker-compose.yml               msmp-${{ steps.version.outputs.VERSION }}-linux-arm64/
          tar -czf msmp-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz \
            msmp-${{ steps.version.outputs.VERSION }}-linux-arm64

      - name: Package windows-amd64
        run: |
          mkdir -p msmp-${{ steps.version.outputs.VERSION }}-windows-amd64
          cp server/msmp-server-windows-amd64.exe    msmp-${{ steps.version.outputs.VERSION }}-windows-amd64/
          cp server/config.yaml                      msmp-${{ steps.version.outputs.VERSION }}-windows-amd64/
          cp agent/msmp-agent-windows-amd64.exe     msmp-${{ steps.version.outputs.VERSION }}-windows-amd64/
          cp -r frontend/dist msmp-${{ steps.version.outputs.VERSION }}-windows-amd64/frontend-dist
          cp docker-compose.yml                      msmp-${{ steps.version.outputs.VERSION }}-windows-amd64/
          tar -czf msmp-${{ steps.version.outputs.VERSION }}-windows-amd64.tar.gz \
            msmp-${{ steps.version.outputs.VERSION }}-windows-amd64

      # ── GitHub Release ─────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            msmp-*-linux-amd64.tar.gz
            msmp-*-linux-arm64.tar.gz
            msmp-*-windows-amd64.tar.gz
