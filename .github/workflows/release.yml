name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
        node-version: ['20']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ── Server binaries（ldflags 注入版本号）─────────────────
      - name: Build server linux-amd64
        working-directory: server
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.Commit=${GITHUB_SHA::8}" -o msmp-server-linux-amd64 .

      - name: Build server linux-arm64
        working-directory: server
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.Commit=${GITHUB_SHA::8}" -o msmp-server-linux-arm64 .

      - name: Build server windows-amd64
        working-directory: server
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.Commit=${GITHUB_SHA::8}" -o msmp-server-windows-amd64.exe .

      # ── Agent binaries ──────────────────────────────────────
      - name: Build agent linux-amd64
        working-directory: agent
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o msmp-agent-linux-amd64 .

      - name: Build agent linux-arm64
        working-directory: agent
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o msmp-agent-linux-arm64 .

      - name: Build agent windows-amd64
        working-directory: agent
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o msmp-agent-windows-amd64.exe .

      # ── Frontend ────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Server packages（管理系统：server + 前端 + 安装脚本）──
      - name: Package server linux
        run: |
          V=${{ steps.version.outputs.VERSION }}
          for arch in amd64 arm64; do
            pkg=msmp-server-${V}-linux-${arch}
            mkdir -p ${pkg}/frontend-dist
            cp server/msmp-server-linux-${arch} ${pkg}/msmp-server-linux-${arch}
            cp server/config.yaml            ${pkg}/config.yaml
            cp docker-compose.yml            ${pkg}/
            cp scripts/install.sh            ${pkg}/install.sh
            cp -r frontend/dist/.            ${pkg}/frontend-dist/
            chmod +x ${pkg}/install.sh
            tar -czf ${pkg}.tar.gz ${pkg}
          done

      - name: Package server windows
        run: |
          V=${{ steps.version.outputs.VERSION }}
          pkg=msmp-server-${V}-windows-amd64
          mkdir -p ${pkg}/frontend-dist
          cp server/msmp-server-windows-amd64.exe ${pkg}/
          cp server/config.yaml                   ${pkg}/config.yaml
          cp -r frontend/dist/.                   ${pkg}/frontend-dist/
          zip -qr ${pkg}.zip ${pkg}

      # ── Agent packages（被监控机只需下载 agent 独立包）────────
      - name: Package agent linux
        run: |
          V=${{ steps.version.outputs.VERSION }}
          for arch in amd64 arm64; do
            pkg=msmp-agent-${V}-linux-${arch}
            mkdir -p ${pkg}
            cp agent/msmp-agent-linux-${arch}  ${pkg}/
            cp scripts/agent-install.sh        ${pkg}/agent-install.sh
            chmod +x ${pkg}/agent-install.sh
            tar -czf ${pkg}.tar.gz ${pkg}
          done

      - name: Package agent windows
        run: |
          V=${{ steps.version.outputs.VERSION }}
          pkg=msmp-agent-${V}-windows-amd64
          mkdir -p ${pkg}
          cp agent/msmp-agent-windows-amd64.exe ${pkg}/
          cp scripts/WINDOWS-AGENT.md           ${pkg}/INSTALL.md
          zip -qr ${pkg}.zip ${pkg}

      # ── GitHub Release ─────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            msmp-server-*-linux-*.tar.gz
            msmp-server-*-windows-amd64.zip
            msmp-agent-*-linux-*.tar.gz
            msmp-agent-*-windows-amd64.zip
