services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: msmp-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - msmp-data:/app/data
    environment:
      - TZ=Asia/Shanghai

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: msmp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: msmp-agent
    restart: unless-stopped
    environment:
      - MSMP_SERVER_URL=http://backend:8080
      - AGENT_UUID=docker-agent

volumes:
  msmp-data: